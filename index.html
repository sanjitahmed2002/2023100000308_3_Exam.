<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Users Feed</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <h1>Users Feed</h1>

    <div id="users-container" class="users-container"></div>


    <script>
        const API_URL = "https://jsonplaceholder.typicode.com/users";

        const usersContainer = document.getElementById("users-container");


        // Fetch users from API
        fetch(API_URL)
            .then(response => {
                if (!response.ok) {
                    throw new Error("Failed to fetch users");
                }

                return response.json();
            })

            .then(users => {

                // Get only the first 6 users
                const firstSixUsers = users.slice(0, 6);

                firstSixUsers.forEach(user => {
                    createUserCard(user);
                });
            })

            .catch(error => {
                console.error("Error fetching users:", error);
            });


        // Create user card
        function createUserCard(user) {

            const card = document.createElement("div");

            card.className = "user-card";

            card.innerHTML = `
                <h2>${user.name}</h2>

                <p>
                    <strong>Username:</strong>
                    ${user.username}
                </p>

                <p>
                    <strong>Email:</strong>
                    ${user.email}
                </p>

                <button class="remove-btn">
                    Remove User
                </button>
            `;


            // Remove button
            const removeButton = card.querySelector(".remove-btn");

            removeButton.addEventListener("click", () => {
                removeUser(user.id, card);
            });


            usersContainer.appendChild(card);
        }


        // Delete user
        function removeUser(userId, card) {

            fetch(`${API_URL}/${userId}`, {
                method: "DELETE"
            })

                .then(response => {

                    // Remove card only when response status is 200
                    if (response.status === 200) {
                        card.remove();
                    }

                    else {
                        throw new Error("Failed to remove user");
                    }
                })

                .catch(error => {
                    console.error("Delete error:", error);
                });
        }
    </script>

</body>

</html>
